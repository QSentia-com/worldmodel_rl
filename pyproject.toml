[project]
name = "qsentia-world-model-rl"
version = "0.1.0"
description = "QSentia WORLD_MODEL-RL allocator runtime for Alpaca paper execution."
requires-python = ">=3.11"
dependencies = [
  "boto3==1.34.106",
  "botocore==1.34.106",
  "s3transfer==0.10.1",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "requests>=2.31",
  "httpx>=0.27,<1",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "s3fs==2024.6.1",
  "fsspec==2024.6.1",
  "urllib3<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "qsentia_worldmodel_rl*",
  "qsentia_worldmodel_rl_containerized*",
  "sentiment*",
]
